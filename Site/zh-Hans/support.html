<h1>支持</h1>

<p>发现了 bug？请在项目的 <a href="https://github.com/ethannicholas/hyperfocal/issues">GitHub Issues 页面</a>提交报告——描述发生了什么以及复现步骤会很有帮助。</p>

<p>如有问题、意见或其他事宜，请发送邮件至 <a href="mailto:ethan@ethannicholas.com">ethan@ethannicholas.com</a>。</p>

<script>
// Dismiss the language dropdown on an outside click or Escape.
addEventListener('click', function (e) {
  var d = document.querySelector('details.lang[open]');
  if (d && !d.contains(e.target)) d.open = false;
});
addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  var d = document.querySelector('details.lang[open]');
  if (d) d.open = false;
