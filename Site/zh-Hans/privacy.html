<h1>隐私政策</h1>

<p><em>最后更新：2026年7月14日</em></p>

<p>Hyperfocal 不会收集、存储或传输任何个人信息。所有处理均完全在本机进行，图像及其他数据绝不会被存储或传输到其他任何地方。</p>
