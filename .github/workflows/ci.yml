name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (build + synth PSNR gates + probe)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config curl unzip \
            libraw-dev liblcms2-dev libjpeg-turbo8-dev libgif-dev \
            libtiff-dev libpng-dev zlib1g-dev libopencv-dev libopenh264-dev

      # GPU fusion is compiled into every Linux build (Package.swift), so this
      # job needs the tree even though it runs no parity gates — the wgpu job
      # below is what exercises the backend, on llvmpipe.
      - name: Fetch pinned wgpu-native
        run: Scripts/fetch-wgpu.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # No rpath: the binaries the gates run link libwgpu_native.so and cannot
      # start without its directory on the loader path.
      - name: Build and run regression gates
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/../wgpu-native/lib
        run: Scripts/ci-gate.sh

  macos:
    name: macOS (gates + probe + Metal + shipping app build)
    # arm64 runner — the Mac build is Apple silicon only (App/project.yml).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      # Same script the Linux job runs; its Darwin branches add retouch-probe
      # and the macOS-calibrated PSNR / DNG floors. `fuse` defaults to
      # --engine auto, so this is also the only CI coverage of the Metal path.
      - name: Build and run regression gates
        run: Scripts/ci-gate.sh

      # The gap this job exists to close: every other gate builds the engine
      # only, and one architecture of it. The app target went unbuildable for a
      # day (Float16 vs the then-universal ARCHS) without anything noticing.
      # package-app.sh IS the release path — it signs ad-hoc when no Developer
      # ID cert is present, which is exactly the runner's situation.
      # --no-archives: the .dmg/.zip step adds nothing a compile gate wants.
      - name: Build the shipping app
        run: |
          brew install xcodegen
          Scripts/package-app.sh --no-archives
          test "$(lipo -archs dist/Hyperfocal.app/Contents/MacOS/Hyperfocal)" = arm64

      # Not gated here: Scripts/ui-test.sh. The XCUITest suite drives real
      # mouse and keyboard and needs a one-time Automation approval from a GUI
      # session, so it stays a local gate.

  linux-wgpu:
    name: Linux wgpu (build + kernel/fusion/dmap parity on llvmpipe)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config curl unzip \
            libraw-dev liblcms2-dev libjpeg-turbo8-dev libgif-dev \
            libtiff-dev libpng-dev zlib1g-dev libopencv-dev \
            libopenh264-dev libvulkan1 mesa-vulkan-drivers

      - name: Fetch pinned wgpu-native
        run: Scripts/fetch-wgpu.sh

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: swiftpm-wgpu-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-wgpu-${{ runner.os }}-

      # llvmpipe is a software adapter (wgpu reports adapterType CPU), so the
      # parity run opts in via HYPERFOCAL_WGPU_SOFTWARE — the same pattern as
      # WARP on the Windows VM: software validates correctness, not speed.
      # (Compiling the backend in needs no flag; only *auto-selecting* a
      # software adapter does.)
      - name: Build with wgpu and run parity gates
        env:
          HYPERFOCAL_WGPU_SOFTWARE: "1"
        run: |
          swift build
          LD_LIBRARY_PATH=$GITHUB_WORKSPACE/../wgpu-native/lib \
            .build/debug/hyperfocal-cli debug-wgpu
