# Windows CI (ROADMAP Windows residual: CI runner): the same gate a dev
# machine runs — Scripts/windows-env.ps1 for the environment, then
# Scripts/ci-gate.sh under Git Bash. Runs on GitHub's arm64 Windows
# runners (free for public repos), matching the arm64-windows triplet the
# port is developed against.
#
# Runs on main pushes and PRs. A run is ~40 minutes against a warm vcpkg
# binary cache (a cold one builds OpenCV and friends from source and takes
# well over an hour), so it is far slower than the Linux job — hence the
# concurrency group: superseded runs are cancelled rather than queued
# behind each other. The ci-windows branch stays wired up for iterating on
# this file itself without touching main.
name: windows
on:
  workflow_dispatch:
  push:
    branches: [main, ci-windows]
  pull_request:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    runs-on: windows-11-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # wgpu is not optional here — Package.swift refuses to even evaluate its
      # manifest without the tree, so this has to land before anything Swift
      # touches, and first so a missing asset fails in seconds rather than
      # after the 40-minute vcpkg step. The platform is passed explicitly:
      # the runner is pinned arm64, and the script's autodetect keys off which
      # MSYS flavour Git Bash reports for `uname -s`, which differs between the
      # x86_64 and arm64 Git for Windows builds.
      - name: Fetch pinned wgpu-native
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' Scripts/fetch-wgpu.sh '' windows-aarch64-msvc
          if ($LASTEXITCODE) { throw "fetch-wgpu failed" }

      - name: Install Swift toolchain
        shell: pwsh
        run: |
          $url = 'https://download.swift.org/swift-6.3.3-release/windows10-arm64/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-windows10-arm64.exe'
          curl.exe -sSL -o "$env:TEMP\swift-installer.exe" $url
          # WiX bundle: quiet install registers PATH/SDKROOT in HKCU, which
          # Scripts/windows-env.ps1 reads — the same discovery path a dev
          # shell uses after the GUI installer.
          $p = Start-Process -Wait -PassThru -FilePath "$env:TEMP\swift-installer.exe" `
              -ArgumentList '/quiet','/norestart'
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) {
            throw "Swift installer exited $($p.ExitCode)"
          }

      # vcpkg binary cache: the imaging stack (OpenCV above all) is a long
      # source build on arm64; archives make later runs restore in minutes.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-arm64-windows-${{ hashFiles('.github/workflows/windows.yml') }}
          restore-keys: vcpkg-arm64-windows-

      - name: Install imaging ports
        shell: pwsh
        run: |
          # Always a fresh clone: the runner's VCPKG_INSTALLATION_ROOT is
          # VS's bundled vcpkg (manifest-mode-only; classic installs never
          # land there — iteration 3's preflight notice proved tiffio.h
          # absent at that root). The binary-archive cache lives under
          # LOCALAPPDATA, so a warm cache still makes this step fast.
          git clone --depth 1 https://github.com/microsoft/vcpkg C:\hf-vcpkg
          & C:\hf-vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw "vcpkg bootstrap failed" }
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=C:\hf-vcpkg"
          # The dev box's exact port set (vcpkg list, 2026-07-22).
          & C:\hf-vcpkg\vcpkg.exe install --triplet arm64-windows `
              --clean-after-build `
              zlib liblzma 'tiff[jpeg,lzma,zip]' libpng 'libjpeg-turbo[jpeg8]' `
              lcms giflib 'libraw[dng-lossy]' 'opencv4[calib3d]'
          if ($LASTEXITCODE) { throw "vcpkg install failed" }
          $tiff = 'C:\hf-vcpkg\installed\arm64-windows\include\tiffio.h'
          if (-not (Test-Path $tiff)) { throw "ports installed but $tiff is missing" }

      - name: ci-gate
        shell: pwsh
        run: |
          . Scripts\windows-env.ps1
          # Preflight facts as ::notice:: annotations — with job-log download
          # 403 even on public repos, annotations via the check-runs API are
          # the only remotely readable telemetry, so state the things a
          # failure diagnosis needs up front.
          Write-Host "::notice::swift = $((Get-Command swift -ErrorAction SilentlyContinue).Source)"
          Write-Host "::notice::VCPKG_ROOT = $env:VCPKG_ROOT (triplet $env:VCPKG_TRIPLET)"
          $tiff = Join-Path $env:VCPKG_ROOT 'installed\arm64-windows\include\tiffio.h'
          Write-Host "::notice::tiffio.h at $tiff = $(Test-Path $tiff)"
          # Fail here rather than 40 minutes later in a compile error: if the
          # environment points at the wrong vcpkg, nothing downstream can work.
          # (It pointed at VS's bundled, manifest-only copy for five runs —
          # vcvarsall exports its own VCPKG_ROOT; see Scripts/windows-env.ps1.)
          if (-not (Test-Path $tiff)) {
            throw "VCPKG_ROOT=$env:VCPKG_ROOT has no arm64-windows tiffio.h - wrong vcpkg tree"
          }
          # Same reasoning for wgpu: windows-env.ps1 discovers the sibling
          # checkout and puts its lib on PATH for the DLL, so an empty
          # WGPU_ROOT here means the fetch step above did not land where
          # Package.swift looks — say so, instead of a manifest fatalError.
          Write-Host "::notice::WGPU_ROOT = $env:WGPU_ROOT"
          if (-not $env:WGPU_ROOT) {
            throw "no wgpu-native tree beside the checkout - Package.swift will refuse the manifest"
          }
          & 'C:\Program Files\Git\bin\bash.exe' Scripts/ci-gate.sh 2>&1 |
              Tee-Object -FilePath gate.log
          if ($LASTEXITCODE) {
            Get-Content gate.log -Tail 25 | ForEach-Object {
              Write-Host "::error::$_"
            }
            exit 1
          }
