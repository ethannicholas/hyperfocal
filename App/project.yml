# XcodeGen spec for the Hyperfocal app target. The engine, vendored Adobe DNG
# SDK, and CLI live in the SwiftPM package at the repo root; this project holds
# only the app layer. Regenerate with:  cd App && xcodegen generate
name: Hyperfocal
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  HyperfocalKit:
    path: ..

# Shared scheme with a test action: xcodebuild test needs it (XcodeGen's
# implicit per-target schemes are user-scoped and carry no tests).
schemes:
  Hyperfocal:
    build:
      targets:
        Hyperfocal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HyperfocalUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  Hyperfocal:
    type: application
    platform: macOS
    sources:
      - Sources
      # Shared model layer (AppModel, Stack, ProjectStore, RetouchSession):
      # single source of truth, also compiled headless by the retouch-probe
      # SwiftPM target (see Package.swift). Never copy these files.
      - path: ../AppCore
      - Assets.xcassets
      # Document icon for .hyperfocal files (macOS does not auto-generate
      # one; without it Finder shows a "?" page). Regenerate from the app
      # icon: white generic-document page + centered app-icon badge.
      - DocumentIcon.icns
      # Crop-rotation cursor art (sectors 0 = top-left corner and 1 = top
      # edge; the other six orientations are derived by flip/transpose at
      # load — see CropOverlayNSView.rotateCursors). Listed as files so
      # they land at the bundle root where NSImage(named:) pairs the @2x.
      - Resources/crop-rotate-0.png
      - Resources/crop-rotate-0@2x.png
      - Resources/crop-rotate-1.png
      - Resources/crop-rotate-1@2x.png
      # String catalog (hand-maintained JSON; keys are the English strings).
      # SwiftUI literals resolve automatically; String-typed plumbing goes
      # through String(localized:)/NSLocalizedString — see AppCore/
      # Localization.swift for the enum displayName seam.
      - Resources/Localizable.xcstrings
      # The macOS slice of the third-party notices, inside the bundle so an
      # installed app carries it without the source tree (About > Third-Party
      # Notices reads it — see NoticesWindow.swift). Generated from the master
      # NOTICE.md by Scripts/gen-notices.py; the macOS build bundles only
      # Apple-framework-free basics (DNG SDK, zlib), so none of the standard
      # license texts in licenses/ apply here — the Qt shell bundles those.
      - path: ../Packaging/notices/macos/NOTICE.md
        buildPhase: resources
    dependencies:
      - package: HyperfocalKit
        product: HyperfocalKit
    # Sandboxed in every build (not just MAS) so the dev build exercises the
    # same file-access rules the App Store requires. Frame access outside the
    # container comes from NSOpenPanel/drag grants, persisted across launches
    # as security-scoped bookmarks in project manifests (see ProjectStore).
    entitlements:
      path: Hyperfocal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # Required to create/resolve app-scoped security bookmarks (the ones
        # ProjectStore persists). Without it bookmarkData(.withSecurityScope)
        # throws and every project saves with no bookmarks — frames then
        # can't be read after relaunch.
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethannicholas.hyperfocal
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        # Sign to run locally. A clone must build for someone who has no
        # Apple Developer account at all — asking Xcode for a "Mac
        # Development" certificate for the team below is a hard build
        # failure on every machine but the maintainer's. Ad-hoc is enough
        # to run and debug (Xcode injects get-task-allow into Debug
        # builds); Scripts/signing.sh upgrades the command-line build to
        # real signing where the team's certificate exists, and the
        # distribution scripts set their own identity. DEVELOPMENT_TEAM is
        # inert under manual ad-hoc signing and stays as the one record of
        # the team (Scripts/signing.sh and the distribution tooling read it here).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: Y3GFBT2WQ2
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        # Apple silicon only, pinned rather than left to ARCHS_STANDARD so a
        # universal build can't be requested by accident. `Float16` — the
        # engine's pixel storage — is unavailable on x86_64 macOS, so an
        # Intel slice cannot compile at all; supporting one would mean a
        # per-architecture storage type, a second set of CPU↔GPU parity bars
        # (the bars are f16-rounding-derived), and a machine to verify it on.
        ARCHS: arm64
        # No App Intents here; skip the metadata pass (it warns about
        # the missing AppIntents.framework on every build otherwise).
        LM_SKIP_METADATA_EXTRACTION: YES
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # No non-exempt encryption (the app makes no network calls beyond
        # opening an HTTPS link); answers App Store Connect's per-build
        # export-compliance question so uploads don't stall on it.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Hyperfocal
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "© 2026 Ethan Nicholas"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        # .hyperfocal projects: owning the exported type gives the files a
        # Hyperfocal-badged document icon and makes double-click (and Dock
        # drops) launch the app — AppDelegate.application(_:open:) routes
        # them to the open-project flow. Projects are store-only zips, so
        # the type honestly conforms to zip-archive (rename-to-.zip works).
        CFBundleDocumentTypes:
          - CFBundleTypeName: Hyperfocal Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [com.ethannicholas.hyperfocal.project]
            CFBundleTypeIconFile: DocumentIcon
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.ethannicholas.hyperfocal.project
            UTTypeDescription: Hyperfocal Project
            UTTypeConformsTo: [com.pkware.zip-archive]
            UTTypeIconFile: DocumentIcon
            UTTypeTagSpecification:
              public.filename-extension: [hyperfocal]
        # Save-panel types whose *preferred* extension is the one the app
        # exports. The live save panel normalizes the filename to the
        # matching allowed type's preferred extension, and the system types
        # prefer ".jpeg"/".tiff" — so exporting through public.jpeg or
        # public.tiff renames "foo.jpg" to "foo.jpeg" in the name field.
        # Imported (not exported) declarations: they describe existing
        # formats without claiming ownership of them. MacDialogService
        # resolves these by identifier for the export panels.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ethannicholas.hyperfocal.jpeg-jpg
            UTTypeDescription: JPEG image
            UTTypeConformsTo: [public.jpeg]
            UTTypeTagSpecification:
              public.filename-extension: [jpg, jpeg]
              public.mime-type: [image/jpeg]
          - UTTypeIdentifier: com.ethannicholas.hyperfocal.tiff-tif
            UTTypeDescription: TIFF image
            UTTypeConformsTo: [public.tiff]
            UTTypeTagSpecification:
              public.filename-extension: [tif, tiff]
              public.mime-type: [image/tiff]

  # The Qt shell's C-ABI bridge is NOT built here: it is a SwiftPM
  # dynamic-library product (HyperfocalBridge in ../Package.swift, over the
  # AppCore module) so the same product definition carries to Linux. See
  # Scripts/build.sh (--qt).

  # XCUITest smoke suite (App/HyperfocalUITests). Fixtures are generated by
  # Scripts/ui-test.sh into the app's sandbox container; tests launch the
  # app with the HYPERFOCAL_UITEST env hooks (see UITestSupport.swift).
  HyperfocalUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - HyperfocalUITests
    dependencies:
      - target: Hyperfocal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ethannicholas.hyperfocal.uitests
        SWIFT_VERSION: "5.0"
        # Ad-hoc by default, for the reason spelled out on the app target.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: Y3GFBT2WQ2
        TEST_TARGET_NAME: Hyperfocal
        GENERATE_INFOPLIST_FILE: YES
